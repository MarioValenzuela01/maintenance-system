<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Users</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <div class="content-wrapper">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="text-primary">User Management</h1>

            <a th:href="@{/users/create}" class="btn btn-success">
                + Create User
            </a>
        </div>

        <hr>

        <div class="card shadow-sm">
            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 text-center">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}"></td>
                        <td class="fw-bold" th:text="${u.username}"></td>
                        <td th:text="${u.fullName}"></td>
                        <td th:text="${u.email}"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${u.role == 'SUPER_ADMIN'} ? ' bg-danger' :
                                                  (${u.role == 'ADMIN'} ? ' bg-primary' : ' bg-secondary')"
                                  th:text="${u.role}">
                            </span>
                        </td>

                        <td>
                            <span th:if="${u.enabled}" class="badge bg-success">Enabled</span>
                            <span th:unless="${u.enabled}" class="badge bg-secondary">Disabled</span>
                        </td>

                        <td>
                            <a th:href="@{/users/edit/{id}(id=${u.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Edit
                            </a>

                            <form th:if="${u.enabled}"
                                  th:action="@{/users/disable/{id}(id=${u.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger ms-1">
                                    Disable
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-muted py-4">
                            No users registered
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>

    </div>
</div>

</body>
</html>
