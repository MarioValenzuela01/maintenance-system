<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create User</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- PAGE CONTENT -->
<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <h1 class="text-primary">Create User</h1>
            <hr>

            <div class="card shadow-sm p-4">

                <form th:action="@{/users/create}" th:object="${user}" method="post">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" th:field="*{username}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control">
                        <div class="text-danger mt-1" th:if="${usernameError}" th:text="${usernameError}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="plainPassword" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Role</label>
                        <select th:field="*{role}" class="form-select" required>
                            <option value="">-- Select Role --</option>
                            <option value="SUPER_ADMIN">SUPER_ADMIN</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="USER">USER</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary px-4">
                        Save User
                    </button>

                    <a th:href="@{/users}" class="btn btn-secondary ms-2">
                        Cancel
                    </a>

                </form>

            </div>

        </div>
    </div>
</main>

<!-- SIDEBAR SCRIPT -->
<script th:src="@{/js/sidebar.js?v=1}"></script>

</body>
</html>
