<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit User</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- PAGE CONTENT -->
<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <h1 class="text-primary">Edit User</h1>
            <hr>

            <div class="card shadow-sm p-4">

                <form th:action="@{/users/edit/{id}(id=${user.id})}" th:object="${user}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" th:field="*{username}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">New Password</label>
                        <input type="password"
                               name="plainPassword"
                               class="form-control"
                               placeholder="Leave blank to keep current password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Role</label>
                        <select th:field="*{role}" class="form-select" required>
                            <option value="SUPER_ADMIN">SUPER_ADMIN</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="USER">USER</option>
                        </select>
                    </div>

                    <div class="form-check form-switch mb-4">
                        <input type="checkbox"
                               th:field="*{enabled}"
                               class="form-check-input"
                               id="enabled">

                        <label class="form-check-label fw-bold" for="enabled">
                            Enabled
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary px-4">
                        Save Changes
                    </button>

                    <a th:href="@{/users}" class="btn btn-secondary ms-2">
                        Cancel
                    </a>

                </form>

            </div>

        </div>
    </div>
</main>

<!-- SIDEBAR SCRIPT -->
<script th:src="@{/js/sidebar.js?v=1}"></script>

</body>
</html>
