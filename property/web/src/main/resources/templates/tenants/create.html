<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Tenant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="text-primary">Register new Tenant</h1>
<hr/>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <form th:action="@{/tenants/create}" th:object="${tenant}" method="post">

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">First Name *</label>
                    <input type="text" th:field="*{firstName}" class="form-control" required />
                </div>

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">Last Name *</label>
                    <input type="text" th:field="*{lastName}" class="form-control" required />
                </div>

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">Email Address *</label>
                    <input type="email" th:field="*{email}" class="form-control" required />
                </div>

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">Phone Number *</label>
                    <input type="text" th:field="*{phone}" class="form-control" required />
                </div>

                <div class="form-group mt-4">
                    <button type="submit" class="btn btn-primary px-4">Guardar</button>
                    <a th:href="@{/tenants}" class="btn btn-secondary ms-2">Cancelar</a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
