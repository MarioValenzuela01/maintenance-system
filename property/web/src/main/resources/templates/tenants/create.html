<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Tenant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="text-primary">Create Tenant</h2>
<hr/>

<form th:action="@{/tenants/create}" th:object="${tenant}" method="post">

    <div class="mb-3">
        <label class="form-label">First Name</label>
        <input type="text" th:field="*{firstName}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input type="text" th:field="*{lastName}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" th:field="*{phone}" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" th:field="*{email}" class="form-control">
    </div>

    <h5>Emergency Contact</h5>

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" th:field="*{emergencyContactName}" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" th:field="*{emergencyContactPhone}" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea th:field="*{notes}" class="form-control"></textarea>
    </div>

    <button class="btn btn-primary">Save</button>
    <a th:href="@{/tenants}" class="btn btn-secondary">Cancel</a>

</form>

</body>
</html>
