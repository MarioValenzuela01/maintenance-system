<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tenant Details</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=12}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <div class="content-wrapper">

        <h2 class="text-primary">Tenant Details</h2>
        <hr/>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="${tenant.firstName + ' ' + tenant.lastName}">
                    Tenant Name
                </h4>
            </div>

            <div class="card-body">

                <h5 class="text-secondary border-bottom pb-2 mb-3">Basic Information</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Phone:</strong>
                        <span th:text="${tenant.phone} ?: 'Not specified'"></span>
                    </div>

                    <div class="col-md-6">
                        <strong>Email:</strong>
                        <span th:text="${tenant.email} ?: 'Not specified'"></span>
                    </div>
                </div>

                <hr/>

                <h5 class="text-secondary border-bottom pb-2 mb-3">Emergency Contact</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Name:</strong>
                        <span th:text="${tenant.emergencyContactName} ?: 'Not specified'"></span>
                    </div>

                    <div class="col-md-6">
                        <strong>Phone:</strong>
                        <span th:text="${tenant.emergencyContactPhone} ?: 'Not specified'"></span>
                    </div>
                </div>

                <hr/>

                <h5 class="text-secondary border-bottom pb-2 mb-3">Household Information</h5>

                <div class="row text-center">
                    <div class="col-md-3 mb-3">
                        <div class="border rounded p-3">
                            <strong>Children</strong>
                            <div th:text="${tenant.childrenCount} ?: 0"></div>
                        </div>
                    </div>

                    <div class="col-md-3 mb-3">
                        <div class="border rounded p-3">
                            <strong>Youth</strong>
                            <div th:text="${tenant.youthCount} ?: 0"></div>
                        </div>
                    </div>

                    <div class="col-md-3 mb-3">
                        <div class="border rounded p-3">
                            <strong>Adults</strong>
                            <div th:text="${tenant.adultsCount} ?: 0"></div>
                        </div>
                    </div>

                    <div class="col-md-3 mb-3">
                        <div class="border rounded p-3">
                            <strong>Seniors</strong>
                            <div th:text="${tenant.seniorsCount} ?: 0"></div>
                        </div>
                    </div>
                </div>

                <hr/>

                <h5 class="text-secondary border-bottom pb-2 mb-3">Pets</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Dogs:</strong>
                        <span th:text="${tenant.dogsCount} ?: 0"></span>

                        <div class="mt-2">
                            <span class="badge bg-primary me-1"
                                  th:each="dog : ${#strings.arraySplit(tenant.dogInfo ?: '', ',')}"
                                  th:if="${!#strings.isEmpty(#strings.trim(dog))}"
                                  th:text="${#strings.trim(dog)}">
                            </span>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <strong>Cats:</strong>
                        <span th:text="${tenant.catsCount} ?: 0"></span>

                        <div class="mt-2">
                            <span class="badge bg-info text-dark me-1"
                                  th:each="cat : ${#strings.arraySplit(tenant.catNames ?: '', ',')}"
                                  th:if="${!#strings.isEmpty(#strings.trim(cat))}"
                                  th:text="${#strings.trim(cat)}">
                            </span>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <strong>Other Pets:</strong>
                    <span th:text="${tenant.otherPets} ?: 'None'"></span>
                </div>

                <hr/>

                <h5 class="text-secondary border-bottom pb-2 mb-3">Vehicles & Lifestyle</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Cars:</strong>
                        <span th:text="${tenant.carsCount} ?: 0"></span>
                    </div>

                    <div class="col-md-6">
                        <strong>Smokers:</strong>
                        <span class="badge bg-warning text-dark"
                              th:text="${tenant.smokers} ? 'Yes' : 'No'">
                        </span>
                    </div>
                </div>

                <hr/>

                <h5 class="text-secondary border-bottom pb-2 mb-3">Notes</h5>

                <p class="text-muted" th:text="${tenant.notes} ?: 'No notes available.'"></p>

                <div class="mt-4 border-top pt-3">
                    <a th:href="@{/tenants/edit/{id}(id=${tenant.id})}" class="btn btn-primary px-4">
                        Edit Tenant
                    </a>

                    <a th:href="@{/tenants}" class="btn btn-secondary ms-2 px-4">
                        Back
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
