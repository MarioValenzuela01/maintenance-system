<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Tenant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="text-danger">Eliminar Arrendatario</h1>
<hr/>

<div class="alert alert-warning">
    <h4>¿Estás seguro de que deseas eliminar este arrendatario?</h4>
    <p>Esta acción no se puede deshacer.</p>
</div>

<div class="card shadow-sm p-4 mb-4" style="max-width: 500px;">
    <dl class="row mb-0">
        <dt class="col-sm-4">ID:</dt>
        <dd class="col-sm-8" th:text="${tenant.id}"></dd>

        <dt class="col-sm-4">Nombre:</dt>
        <dd class="col-sm-8" th:text="${tenant.firstName + ' ' + tenant.lastName}"></dd>

        <dt class="col-sm-4">Email:</dt>
        <dd class="col-sm-8" th:text="${tenant.email}"></dd>

        <dt class="col-sm-4">Number Phone:</dt>
        <dd class="col-sm-8" th:text="${tenant.phone}"></dd>
    </dl>
</div>

<form th:action="@{/tenants/delete/{id}(id=${tenant.id})}" method="post">
    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
    <a th:href="@{/tenants}" class="btn btn-secondary ms-2">Cancelar</a>
</form>

</body>
</html>
