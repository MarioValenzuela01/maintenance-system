<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Tenant</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=11}" rel="stylesheet"/>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- PAGE CONTENT -->
<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <h1 class="text-danger">Delete Tenant</h1>
            <hr/>

            <div class="alert alert-warning">
                <h4>Are you sure you want to deactivate this tenant?</h4>
                <p class="mb-0">This action will deactivate the tenant record.</p>
            </div>

            <div th:if="${deleteError}" class="alert alert-danger">
                <strong>Cannot deactivate tenant:</strong>
                <span th:text="${deleteError}"></span>
            </div>

            <div class="card shadow-sm p-4 mb-4" style="max-width: 500px;">
                <dl class="row mb-0">
                    <dt class="col-sm-4">ID:</dt>
                    <dd class="col-sm-8" th:text="${tenant.id}"></dd>

                    <dt class="col-sm-4">Name:</dt>
                    <dd class="col-sm-8" th:text="${tenant.firstName + ' ' + tenant.lastName}"></dd>

                    <dt class="col-sm-4">Email:</dt>
                    <dd class="col-sm-8" th:text="${tenant.email}"></dd>

                    <dt class="col-sm-4">Phone:</dt>
                    <dd class="col-sm-8" th:text="${tenant.phone}"></dd>
                </dl>
            </div>

            <form th:action="@{/tenants/delete/{id}(id=${tenant.id})}" method="post">
                <button type="submit" class="btn btn-danger">Yes, Deactivate</button>
                <a th:href="@{/tenants}" class="btn btn-secondary ms-2">Cancel</a>
            </form>

        </div>
    </div>
</main>

<!-- SIDEBAR SCRIPT -->
<script th:src="@{/js/sidebar.js?v=1}"></script>

</body>
</html>
