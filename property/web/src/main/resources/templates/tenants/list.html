<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tenants List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="text-primary">Arrendatarios (Tenants)</h1>
    <a th:href="@{/tenants/create}" class="btn btn-success">+ Añadir Arrendatario</a>
</div>
<hr/>

<div class="card shadow-sm p-4">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th class="text-center">Actions</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tenants}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.firstName}"></td>
            <td th:text="${t.lastName}"></td>
            <td th:text="${t.email}"></td>
            <td th:text="${t.phone}"></td>
            <td class="text-center">
                <a th:href="@{/tenants/edit/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a th:href="@{/tenants/delete/{id}(id=${t.id})}" class="btn btn-sm btn-outline-danger ms-2">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tenants)}">
            <td colspan="5" class="text-center text-muted">No hay arrendatarios registrados. ¡Añade uno!</td>
        </tr>
        </tbody>
    </table>

</div>
<div class="mt-4">
    <a th:href="@{/tenants}" class="btn btn-outline-primary">Tenants</a>
    <a th:href="@{/units}" class="btn btn-outline-info ms-2">Units</a>
    <a th:href="@{/}" class="btn btn-secondary ms-2">Home</a>
</div>
</body>
</html>
