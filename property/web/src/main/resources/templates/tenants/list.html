<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tenants</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <!-- SIDEBAR -->
    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <!-- CONTENT -->
    <div class="content-wrapper">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="text-primary">Tenants Management</h1>
            <a th:href="@{/tenants/create}" class="btn btn-success">+ Add Tenant</a>
        </div>

        <hr>

        <div class="card shadow-sm">
            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 text-center">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="t : ${tenants}">
                        <td th:text="${t.id}"></td>
                        <td>
                            <a th:href="@{/tenants/details/{id}(id=${t.id})}"
                               th:text="${t.firstName + ' ' + t.lastName}"
                               class="text-decoration-none fw-bold">

                            </a>
                        </td>
                        <td th:text="${t.email}"></td>
                        <td th:text="${t.phone}"></td>

                        <td>
                            <a th:href="@{/tenants/edit/{id}(id=${t.id})}"
                               class="btn btn-sm btn-outline-primary">Edit</a>

                            <a th:href="@{/tenants/delete/{id}(id=${t.id})}"
                               class="btn btn-sm btn-outline-danger ms-1">Delete</a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(tenants)}">
                        <td colspan="5" class="text-muted">No tenants registered</td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
