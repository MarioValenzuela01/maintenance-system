<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Maintenance Record</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=10}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <div class="content-wrapper">

        <h1 class="text-primary">Edit Maintenance Record</h1>
        <hr>

        <div class="card shadow-sm p-4">

            <form th:action="@{/unit-history/edit/{id}(id=${history.id})}"
                  th:object="${history}"
                  method="post">

                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{unitId}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Category</label>
                        <select th:field="*{category}" class="form-select" required>
                            <option value="">-- Select Category --</option>
                            <option value="Appliance">Appliance</option>
                            <option value="Bathroom">Bathroom</option>
                            <option value="Flooring">Flooring</option>
                            <option value="Paint">Paint</option>
                            <option value="Safety">Safety</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Item</label>
                        <select th:field="*{itemName}" class="form-select" required>
                            <option value="">-- Select Item --</option>
                            <option value="Fridge">Fridge</option>
                            <option value="Stove">Stove</option>
                            <option value="Tub">Tub</option>
                            <option value="Toilet">Toilet</option>
                            <option value="Painted">Painted</option>
                            <option value="Reno Bathroom">Reno Bathroom</option>
                            <option value="Flooring">Flooring</option>
                            <option value="Sump Pump">Sump Pump</option>
                            <option value="Smoke Alarm Battery">Smoke Alarm Battery</option>
                            <option value="Smoke Alarm Hard Wire">Smoke Alarm Hard Wire</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Completed Date</label>
                    <input type="date"
                           th:field="*{completedDate}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Notes</label>
                    <textarea th:field="*{notes}"
                              class="form-control"
                              rows="4"></textarea>
                </div>

                <div class="mt-4 border-top pt-3">
                    <button type="submit" class="btn btn-primary px-4">
                        Save Changes
                    </button>

                    <a th:href="@{/units/{id}/history(id=${history.unitId})}"
                       class="btn btn-secondary ms-2 px-4">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </div>
</div>

</body>
</html>
