<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Maintenance Record</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=10}" rel="stylesheet"/>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- PAGE CONTENT -->
<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <h1 class="text-danger">Delete Maintenance Record</h1>
            <hr>

            <div class="alert alert-warning">
                <h5>Are you sure you want to delete this maintenance record?</h5>
                <p class="mb-0">This action cannot be undone.</p>
            </div>

            <div class="card shadow-sm p-4 mb-4">

                <dl class="row mb-0">
                    <dt class="col-sm-3">Date:</dt>
                    <dd class="col-sm-9" th:text="${history.completedDate}"></dd>

                    <dt class="col-sm-3">Category:</dt>
                    <dd class="col-sm-9" th:text="${history.category}"></dd>

                    <dt class="col-sm-3">Item:</dt>
                    <dd class="col-sm-9" th:text="${history.itemName}"></dd>

                    <dt class="col-sm-3">Notes:</dt>
                    <dd class="col-sm-9" th:text="${history.notes}"></dd>
                </dl>

            </div>

            <form th:action="@{/unit-history/delete/{id}(id=${history.id})}"
                  method="post">

                <input type="hidden" name="unitId" th:value="${history.unitId}">

                <button type="submit" class="btn btn-danger px-4">
                    Yes, Delete
                </button>

                <a th:href="@{/units/{id}/history(id=${history.unitId})}"
                   class="btn btn-secondary ms-2 px-4">
                    Cancel
                </a>

            </form>

        </div>
    </div>
</main>

<!-- SIDEBAR SCRIPT -->
<script th:src="@{/js/sidebar.js?v=1}"></script>

</body>
</html>
