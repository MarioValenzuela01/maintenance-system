<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Work Order Details</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=10}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h1 class="text-primary">Work Order Details</h1>
                    <p class="text-muted mb-0">
                        Work Order #
                        <span th:text="${workOrder.id}">1</span>
                    </p>
                </div>

                <a th:href="@{/work-orders/edit/{id}(id=${workOrder.id})}"
                   class="btn btn-outline-warning"
                   sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')">
                    Edit
                </a>
            </div>

            <hr>

            <div class="card shadow-sm p-4">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <strong>Unit:</strong>
                        <div th:text="${workOrder.unitDisplayLabel}">Unit</div>
                    </div>

                    <div class="col-md-6">
                        <strong>Status:</strong>
                        <div>
                            <span class="badge bg-info text-dark" th:text="${workOrder.status}">Status</span>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <strong>Work Type:</strong>
                        <div th:text="${workOrder.workType}">Type</div>
                    </div>

                    <div class="col-md-4">
                        <strong>Priority:</strong>
                        <div th:text="${workOrder.priority}">Priority</div>
                    </div>

                    <div class="col-md-4">
                        <strong>Due Date:</strong>
                        <div th:text="${workOrder.dueDate != null ? workOrder.dueDate : 'No due date'}">Due date</div>
                    </div>
                </div>

                <div class="mb-3">
                    <strong>Assigned To:</strong>
                    <div th:text="${workOrder.assignedToFullName != null && !workOrder.assignedToFullName.isBlank() ? workOrder.assignedToFullName + ' (' + workOrder.assignedToUsername + ')' : workOrder.assignedToUsername}">
                        User
                    </div>
                </div>

                <div class="mb-3">
                    <strong>Created By:</strong>
                    <div th:text="${workOrder.createdByFullName != null && !workOrder.createdByFullName.isBlank() ? workOrder.createdByFullName + ' (' + workOrder.createdByUsername + ')' : workOrder.createdByUsername}">
                        Creator
                    </div>
                </div>

                <div class="mb-3">
                    <strong>Description:</strong>
                    <p th:text="${workOrder.description}">Description</p>
                </div>

                <div class="mb-3">
                    <strong>Notes:</strong>
                    <p th:text="${workOrder.notes != null && !workOrder.notes.isBlank() ? workOrder.notes : 'No notes'}">
                        Notes
                    </p>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <strong>Created Date:</strong>
                        <div th:text="${workOrder.createdDate}">Created</div>
                    </div>

                    <div class="col-md-4">
                        <strong>Completed Date:</strong>
                        <div th:text="${workOrder.completedDate != null ? workOrder.completedDate : 'Not completed'}">
                            Completed
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 flex-wrap">

                    <form th:action="@{/work-orders/status/{id}(id=${workOrder.id})}"
                          method="post"
                          th:if="${workOrder.status != 'IN_PROGRESS' && workOrder.status != 'COMPLETED' && workOrder.status != 'CANCELLED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="status" value="IN_PROGRESS">
                        <button type="submit" class="btn btn-outline-warning">
                            Mark In Progress
                        </button>
                    </form>

                    <form th:action="@{/work-orders/status/{id}(id=${workOrder.id})}"
                          method="post"
                          th:if="${workOrder.status != 'COMPLETED' && workOrder.status != 'CANCELLED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="status" value="COMPLETED">
                        <button type="submit" class="btn btn-outline-success">
                            Mark Completed
                        </button>
                    </form>

                    <form th:action="@{/work-orders/cancel/{id}(id=${workOrder.id})}"
                          method="post"
                          sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')"
                          th:if="${workOrder.status != 'CANCELLED' && workOrder.status != 'COMPLETED'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline-danger">
                            Cancel Work Order
                        </button>
                    </form>

                    <a th:href="@{/work-orders}" class="btn btn-secondary"
                       sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')">
                        Back to Work Orders
                    </a>

                    <a th:href="@{/work-orders/my}" class="btn btn-secondary"
                       sec:authorize="hasRole('USER')">
                        Back to My Orders
                    </a>

                </div>

            </div>

        </div>
    </div>
</main>

<script th:src="@{/js/loading.js?v=2}"></script>
</body>
</html>
