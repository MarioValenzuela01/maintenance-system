<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Work Orders</title>
    <link rel="icon" type="image/png" th:href="@{/images/Cornestone-small.png}">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=10}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <h1 class="text-primary">My Work Orders</h1>
            <p class="text-muted">Jobs assigned to your user account.</p>
            <hr>

            <div class="row">
                <div class="col-md-6 mb-3" th:each="wo : ${workOrders}">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">

                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="card-title mb-1" th:text="${wo.unitDisplayLabel}">Unit</h5>
                                <span class="badge bg-info text-dark" th:text="${wo.status}">Status</span>
                            </div>

                            <p class="text-muted mb-2">
                                <strong>Type:</strong>
                                <span th:text="${wo.workType}">Type</span>
                                |
                                <strong>Priority:</strong>
                                <span th:text="${wo.priority}">Priority</span>
                            </p>

                            <p th:text="${wo.description}">Description</p>

                            <p class="mb-2">
                                <strong>Due Date:</strong>
                                <span th:text="${wo.dueDate != null ? wo.dueDate : 'No due date'}">Due date</span>
                            </p>

                            <div class="d-flex gap-2 flex-wrap">
                                <a th:href="@{/work-orders/details/{id}(id=${wo.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Details
                                </a>

                                <form th:action="@{/work-orders/status/{id}(id=${wo.id})}"
                                      method="post"
                                      th:if="${wo.status != 'IN_PROGRESS' && wo.status != 'COMPLETED' && wo.status != 'CANCELLED'}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="status" value="IN_PROGRESS">
                                    <button type="submit" class="btn btn-sm btn-outline-warning">
                                        Start
                                    </button>
                                </form>

                                <form th:action="@{/work-orders/status/{id}(id=${wo.id})}"
                                      method="post"
                                      th:if="${wo.status != 'COMPLETED' && wo.status != 'CANCELLED'}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="status" value="COMPLETED">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        Complete
                                    </button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="col-12" th:if="${#lists.isEmpty(workOrders)}">
                    <div class="alert alert-info">
                        You do not have assigned work orders right now.
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<script th:src="@{/js/loading.js?v=2}"></script>
</body>
</html>
