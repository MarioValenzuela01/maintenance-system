<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Unit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="text-primary">Registrar Nueva Unidad</h1>
<hr/>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <form th:action="@{/units/create}" th:object="${unit}" method="post">

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">Unit Number *</label>
                    <input type="text" th:field="*{unitNumber}" class="form-control" placeholder="Ej. Apt 101, Local B" required />
                    <label class="control-label fw-bold">Address *</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="Ej. Apt 101, Local B" required />

                </div>

                <div class="form-group mt-4">
                    <button type="submit" class="btn btn-primary px-4">Guardar</button>
                    <a th:href="@{/units}" class="btn btn-secondary ms-2">Cancelar</a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
