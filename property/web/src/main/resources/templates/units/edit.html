<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Unit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="text-primary">Editar Unidad</h1>
<hr/>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <form th:action="@{/units/edit/{id}(id=${unit.id})}" th:object="${unit}" method="post">

                <!-- CAMPO OCULTO REQUERIDO PARA QUE SPRING SEPA QUÉ REGISTRO ACTUALIZAR -->
                <input type="hidden" th:field="*{id}" />

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">Número o Nombre de la Unidad *</label>
                    <input type="text" th:field="*{unitNumber}" class="form-control" required />
                </div>

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">Dirección *</label>
                    <input type="text" th:field="*{address}" class="form-control" required />
                </div>

                <div class="form-group mt-4">
                    <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                    <a th:href="@{/units}" class="btn btn-secondary ms-2">Cancelar</a>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
