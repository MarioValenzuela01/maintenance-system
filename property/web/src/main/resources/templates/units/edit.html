<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Unit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="text-primary">Edit Unit</h1>
<hr/>

<div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0" th:text="'Edit Unit ' + ${unit.unitNumber}"></h4>
    </div>

    <div class="card-body">
        <form th:action="@{/units/edit/{id}(id=${unit.id})}" th:object="${unit}" method="post">

            <input type="hidden" th:field="*{id}" />

            <h5>Basic Information</h5>

            <div class="mb-3">
                <label class="form-label fw-bold">Unit Number *</label>
                <input type="text" th:field="*{unitNumber}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Address *</label>
                <input type="text" th:field="*{address}" class="form-control" required />
            </div>


            <div class="mb-3">
                <label class="form-label fw-bold">Ownership Type</label>
                <input type="text" th:field="*{ownershipType}" class="form-control" />
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Program Type</label>
                <input type="text" th:field="*{programType}" class="form-control" />
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{managedByCornerstone}" class="form-check-input" id="managedByCornerstone">
                <label class="form-check-label fw-bold" for="managedByCornerstone">
                    Managed by Cornerstone
                </label>
            </div>

            <hr/>

            <h5>Unit Characteristics</h5>

            <div class="mb-3">
                <label class="form-label fw-bold">Bedrooms</label>
                <input type="number" th:field="*{bedrooms}" class="form-control" min="0" />
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Bathrooms</label>
                <input type="number" th:field="*{bathrooms}" class="form-control" min="0" />
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Floors</label>
                <input type="number" th:field="*{floors}" class="form-control" min="1" />
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{hasBasement}" class="form-check-input" id="hasBasement">
                <label class="form-check-label fw-bold" for="hasBasement">
                    Basement
                </label>
            </div>

            <hr/>

            <h5>Notes</h5>

            <div class="mb-3">
                <textarea th:field="*{notes}" class="form-control" rows="4"></textarea>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a th:href="@{/units/details/{id}(id=${unit.id})}" class="btn btn-secondary ms-2">
                    Back to Details
                </a>

                <a th:href="@{/units}" class="btn btn-outline-secondary ms-2">
                    Back to Units
                </a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
