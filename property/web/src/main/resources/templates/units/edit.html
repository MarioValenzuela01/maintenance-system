<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Unit</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- PAGE CONTENT -->
<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <h1 class="text-primary">Edit Unit</h1>
            <hr/>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="|Editing Unit: ${unit.unitNumber}|">Edit Unit</h4>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/units/edit/{id}(id=${unit.id})}" th:object="${unit}" method="post">

                        <input type="hidden" th:field="*{id}"/>

                        <h5 class="text-secondary border-bottom pb-2 mb-3">Basic Information</h5>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Unit Number *</label>
                                <input type="text" th:field="*{unitNumber}" class="form-control" required/>
                            </div>

                            <div class="col-md-8 mb-3">
                                <label class="form-label fw-bold">Display Name</label>
                                <input type="text"
                                       th:field="*{displayName}"
                                       class="form-control"
                                       placeholder="Example: Shed, Accessible Shed">
                                <small class="text-muted">
                                    Optional. If empty, the system will show the Unit Number.
                                </small>
                            </div>

                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-bold">Address *</label>
                                <input type="text" th:field="*{address}" class="form-control" required/>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Ownership Type</label>
                                <input type="text" th:field="*{ownershipType}" class="form-control"/>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Program Type</label>
                                <input type="text" th:field="*{programType}" class="form-control"/>
                            </div>
                        </div>

                        <div class="form-check form-switch mb-3 ms-1">
                            <input type="checkbox"
                                   th:field="*{managedByCornerstone}"
                                   class="form-check-input"
                                   id="managedByCornerstone">
                            <label class="form-check-label fw-bold" for="managedByCornerstone">
                                Managed by Cornerstone
                            </label>
                        </div>

                        <hr class="my-4"/>

                        <h5 class="text-secondary border-bottom pb-2 mb-3">Unit Characteristics & Map</h5>

                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label fw-bold">Bedrooms</label>
                                <input type="number" th:field="*{bedrooms}" class="form-control" min="0"/>
                            </div>

                            <div class="col-md-3 mb-3">
                                <label class="form-label fw-bold">Bathrooms</label>
                                <input type="number" th:field="*{bathrooms}" class="form-control" min="0"/>
                            </div>

                            <div class="col-md-3 mb-3">
                                <label class="form-label fw-bold">Floors</label>
                                <input type="number" th:field="*{floors}" class="form-control" min="1"/>
                            </div>

                            <div class="col-md-3 mb-3 d-flex align-items-end pb-2">
                                <div class="form-check form-switch">
                                    <input type="checkbox"
                                           th:field="*{hasBasement}"
                                           class="form-check-input"
                                           id="hasBasement">
                                    <label class="form-check-label fw-bold" for="hasBasement">
                                        Basement
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 mt-2">
                            <label class="form-label fw-bold text-primary">Google Maps Embed URL</label>
                            <input type="text"
                                   th:field="*{googleMapsUrl}"
                                   class="form-control border-primary"
                                   placeholder="https://www.google.com/maps/embed?pb=...">
                            <div class="form-text">
                                Copy only the link inside the <code>src</code> attribute from Google Maps embed code.
                            </div>
                        </div>

                        <hr class="my-4"/>

                        <h5 class="text-secondary border-bottom pb-2 mb-3">Notes</h5>

                        <div class="mb-3">
                            <textarea th:field="*{notes}"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Additional details..."></textarea>
                        </div>

                        <div class="mt-4 border-top pt-3 text-end">
                            <button type="submit" class="btn btn-primary px-4">
                                Save Changes
                            </button>

                            <a th:href="@{/units/details/{id}(id=${unit.id})}"
                               class="btn btn-secondary ms-2 px-4">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- SIDEBAR SCRIPT -->
<script th:src="@{/js/sidebar.js?v=1}"></script>

</body>
</html>
