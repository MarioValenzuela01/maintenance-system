<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Work History</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=10}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <div class="content-wrapper">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="text-primary">Work History</h1>
                <p class="text-muted mb-0">
                    Unit <strong th:text="${unit.unitNumber}"></strong>
                    -
                    <span th:text="${unit.address}"></span>
                </p>
            </div>

            <a th:href="@{/unit-history/create/{unitId}(unitId=${unit.id})}"
               class="btn btn-success">
                Add Work Record
            </a>
        </div>

        <hr>

        <div class="card shadow-sm p-3 mb-4">

            <form th:action="@{/units/{id}/history(id=${unit.id})}" method="get">
                <div class="row g-2">

                    <div class="col-md-6">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search work, notes, tenant..."
                               th:value="${keyword}">
                    </div>

                    <div class="col-md-3">
                        <select name="category" class="form-select">
                            <option value="">All Categories</option>
                            <option value="Appliance" th:selected="${category == 'Appliance'}">Appliance</option>
                            <option value="Bathroom" th:selected="${category == 'Bathroom'}">Bathroom</option>
                            <option value="Flooring" th:selected="${category == 'Flooring'}">Flooring</option>
                            <option value="Paint" th:selected="${category == 'Paint'}">Paint</option>
                            <option value="Safety" th:selected="${category == 'Safety'}">Safety</option>
                            <option value="Plumbing" th:selected="${category == 'Plumbing'}">Plumbing</option>
                            <option value="Other" th:selected="${category == 'Other'}">Other</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <button class="btn btn-primary">Search</button>
                        <a th:href="@{/units/{id}/history(id=${unit.id})}" class="btn btn-secondary">
                            Clear
                        </a>
                    </div>

                </div>
            </form>

            <div class="mt-3">
                <a th:href="@{/units/{id}/history(id=${unit.id})}"
                   class="btn btn-sm btn-outline-dark">
                    All
                </a>

                <a th:href="@{/units/{id}/history(id=${unit.id}, category='Appliance')}"
                   class="btn btn-sm btn-outline-primary">
                    Appliances
                </a>

                <a th:href="@{/units/{id}/history(id=${unit.id}, category='Bathroom')}"
                   class="btn btn-sm btn-outline-primary">
                    Bathroom
                </a>

                <a th:href="@{/units/{id}/history(id=${unit.id}, category='Flooring')}"
                   class="btn btn-sm btn-outline-primary">
                    Flooring
                </a>

                <a th:href="@{/units/{id}/history(id=${unit.id}, category='Paint')}"
                   class="btn btn-sm btn-outline-primary">
                    Paint
                </a>

                <a th:href="@{/units/{id}/history(id=${unit.id}, category='Safety')}"
                   class="btn btn-sm btn-outline-primary">
                    Safety
                </a>
            </div>

        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 text-center">
                    <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Work Done</th>
                        <th>Category</th>
                        <th>Tenant at that time</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="item : ${historyList}">
                        <td th:text="${item.completedDate}"></td>
                        <td th:text="${item.itemName}"></td>
                        <td th:text="${item.category}"></td>
                        <td th:text="${item.tenantNameAtTime}"></td>
                        <td th:text="${item.notes}"></td>
                        <td>
                            <a th:href="@{/unit-history/edit/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Edit
                            </a>

                            <a th:href="@{/unit-history/delete/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-danger ms-1">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(historyList)}">
                        <td colspan="6" class="text-muted py-4">
                            No work history found.
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/units/details/{id}(id=${unit.id})}"
               class="btn btn-secondary">
                Back to Unit
            </a>
        </div>

    </div>
</div>

</body>
</html>
