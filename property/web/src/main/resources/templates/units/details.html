<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Unit Details</title>

<body>

<div class="main-wrapper"> <!-- INICIO DEL WRAPPER -->

    <h1 class="text-primary mt-4">Unit Details</h1>
    <hr/>

    <!-- Tarjeta Principal: Información y Mapa -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="|Details for Unit ${unit.unitNumber}|">Unit Details</h4>
        </div>
        <div class="card-body">
            <div class="row align-items-center">

                <!-- Columna Izquierda: Información de la Unidad -->
                <div class="col-md-6 border-end">
                    <h5 class="text-secondary border-bottom pb-2 mb-4 fs-5">Basic Information</h5>

                    <p class="mb-3 fs-5">
                        <strong>Address:</strong>
                        <span th:text="|${unit.unitNumber} ${unit.address}|"></span>
                    </p>

                    <p class="mb-3 fs-5">
                        <strong>Status:</strong>
                        <span class="badge bg-success" th:if="${statusCalculated == 'Available'}">Available</span>
                        <span class="badge bg-danger" th:if="${statusCalculated == 'Occupied'}">Occupied</span>
                        <span class="badge bg-primary" th:if="${statusCalculated == 'Managed'}">Managed</span>
                    </p>

                    <div th:if="${activeLease != null}" class="mb-3 text-primary fs-5">
                        <p class="mb-0"><strong>Tenant:</strong>
                            <span th:text="${activeLease.tenantName}"></span>
                        </p>
                    </div>

                    <p class="mb-3 fs-5"><strong>Program Type:</strong> <span th:text="${unit.programType}"></span></p>

                    <p class="mb-3 fs-5">
                        <strong>Managed by Cornerstone:</strong>
                        <span class="badge rounded-pill bg-light text-dark border"
                              th:text="${unit.managedByCornerstone} ? 'Yes' : 'No'"></span>
                    </p>
                </div>

                <!-- Columna Derecha: Mapa de Google -->
                <div class="col-md-6 ps-md-4 mt-3 mt-md-0">
                    <div th:if="${unit.googleMapsUrl != null and !unit.googleMapsUrl.isEmpty()}">
                        <h5 class="text-secondary mb-3 fs-5">Unit Location</h5>
                        <div class="ratio ratio-16x9 shadow-sm border" style="border-radius: 12px; overflow: hidden;">
                            <iframe th:src="${unit.googleMapsUrl}"
                                    style="border:0;"
                                    allowfullscreen=""
                                    loading="lazy"
                                    referrerpolicy="no-referrer-when-downgrade">
                            </iframe>
                        </div>
                    </div>

                    <!-- Mensaje si no hay mapa disponible -->
                    <div th:if="${unit.googleMapsUrl == null or unit.googleMapsUrl.isEmpty()}"
                         class="alert alert-light border text-center py-4 mb-0">
                        <p class="mb-0 text-muted">No Google Maps link available for this unit.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Segunda Tarjeta: Características y Notas -->
    <div class="card shadow-sm p-4">
        <h5 class="text-secondary border-bottom pb-2 mb-4 fs-5">Unit Characteristics</h5>

        <div class="row mb-3">
            <div class="col-md-3">
                <p><strong>Bedrooms:</strong> <span th:text="${unit.bedrooms} ?: 'Not specified'"></span></p>
            </div>
            <div class="col-md-3">
                <p><strong>Bathrooms:</strong> <span th:text="${unit.bathrooms} ?: 'Not specified'"></span></p>
            </div>
            <div class="col-md-3">
                <p><strong>Floors:</strong> <span th:text="${unit.floors} ?: 'Not specified'"></span></p>
            </div>
            <div class="col-md-3">
                <p><strong>Basement:</strong> <span th:text="${unit.hasBasement} ? 'Yes' : 'No'"></span></p>
            </div>
        </div>

        <hr/>

        <h5 class="text-secondary fs-5">Notes</h5>
        <p class="text-muted" th:text="${unit.notes} ?: 'No notes available.'"></p>

        <div class="mt-4 border-top pt-3">
            <a th:href="@{/units/edit/{id}(id=${unit.id})}" class="btn btn-primary px-4">
                Edit Unit
            </a>
            <a th:href="@{/units}" class="btn btn-secondary ms-2 px-4">
                Back to Units
            </a>
        </div>
    </div>

</div> <!-- FIN DEL WRAPPER -->

</body>
</html>
