<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unit Details</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=10}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <!-- SIDEBAR -->
    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <!-- CONTENIDO -->
    <div class="content-wrapper">

        <h1 class="text-primary">Unit Details</h1>
        <hr/>

        <!-- TARJETA PRINCIPAL -->
        <div class="card shadow-sm mb-4">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="|Details for Unit ${unit.unitNumber}|"></h4>
            </div>

            <div class="card-body">
                <div class="row align-items-center">

                    <!-- INFO -->
                    <div class="col-md-6 border-end">

                        <h5 class="text-secondary border-bottom pb-2 mb-4">Basic Information</h5>

                        <p class="mb-3">
                            <strong>Address:</strong>
                            <span th:text="|${unit.unitNumber} ${unit.address}|"></span>
                        </p>

                        <p class="mb-3">
                            <strong>Status:</strong>

                            <span class="badge bg-success"
                                  th:if="${statusCalculated == 'Available'}">
                                Available
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${statusCalculated == 'Occupied'}">
                                Occupied
                            </span>

                            <span class="badge bg-primary"
                                  th:if="${statusCalculated == 'Managed'}">
                                Cornerstone Managed
                            </span>
                        </p>

                        <div th:if="${activeLease != null}" class="mb-3 text-primary">
                            <strong>Tenant:</strong>

                            <a th:href="@{/tenants/details/{id}(id=${activeLease.tenantId})}"
                               th:text="${activeLease.tenantName}"
                               class="text-decoration-none fw-semibold">
                            </a>
                        </div>

                        <p class="mb-3">
                            <strong>Program Type:</strong>
                            <span th:text="${unit.programType}"></span>
                        </p>

                        <p class="mb-3">
                            <strong>Managed by Cornerstone:</strong>
                            <span class="badge bg-light text-dark border"
                                  th:text="${unit.managedByCornerstone} ? 'Yes' : 'No'">
                            </span>
                        </p>

                    </div>

                    <!-- MAPA -->
                    <div class="col-md-6 ps-md-4 mt-3 mt-md-0">

                        <div th:if="${unit.googleMapsUrl != null and !unit.googleMapsUrl.isEmpty()}">

                            <h5 class="text-secondary mb-3">Unit Location</h5>

                            <div style="position: relative; border-radius: 12px; overflow: hidden;"
                                 class="shadow-sm border">

                                <div class="ratio ratio-16x9">
                                    <iframe th:src="${unit.googleMapsUrl}"
                                            style="border:0;"
                                            loading="lazy">
                                    </iframe>
                                </div>



                            </div>
                        </div>

                        <div th:if="${unit.googleMapsUrl == null or unit.googleMapsUrl.isEmpty()}"
                             class="alert alert-light border text-center py-4 mb-0">
                            No Google Maps link available.
                        </div>

                    </div>

                </div>
            </div>
        </div>

        <!-- SEGUNDA TARJETA -->
        <div class="card shadow-sm p-4">

            <h5 class="text-secondary border-bottom pb-2 mb-4">Unit Characteristics</h5>

            <div class="row mb-3">
                <div class="col-md-3">
                    <p><strong>Bedrooms:</strong> <span th:text="${unit.bedrooms} ?: 'Not specified'"></span></p>
                </div>
                <div class="col-md-3">
                    <p><strong>Bathrooms:</strong> <span th:text="${unit.bathrooms} ?: 'Not specified'"></span></p>
                </div>
                <div class="col-md-3">
                    <p><strong>Floors:</strong> <span th:text="${unit.floors} ?: 'Not specified'"></span></p>
                </div>
                <div class="col-md-3">
                    <p><strong>Basement:</strong> <span th:text="${unit.hasBasement} ? 'Yes' : 'No'"></span></p>
                </div>
            </div>

            <hr/>

            <h5 class="text-secondary">Notes</h5>
            <p class="text-muted" th:text="${unit.notes} ?: 'No notes available.'"></p>

            <div class="mt-4 border-top pt-3">
                <a th:href="@{/units/edit/{id}(id=${unit.id})}" class="btn btn-primary px-4">
                    Edit Unit
                </a>
                <a th:href="@{/units}" class="btn btn-secondary ms-2 px-4">
                    Back
                </a>
            </div>

        </div>

    </div>
</div>

</body>
</html>
