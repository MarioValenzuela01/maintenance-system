<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unit Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="text-primary">Unit Details</h1>
<hr/>

<div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0" th:text="'Unit ' + ${unit.unitNumber}"></h4>
    </div>

    <div class="card-body">

        <h5>Basic Information</h5>

        <p><strong>Address:</strong> <span th:text="${unit.address}"></span></p>
        <p>
            <strong>Status:</strong>
            <span class="badge bg-success" th:if="${statusCalculated == 'Available'}">Available</span>
            <span class="badge bg-danger" th:if="${statusCalculated == 'Occupied'}">Occupied</span>
        </p>

        <div th:if="${activeLease != null}">
            <p><strong>Tenant:</strong>
                <span th:text="${activeLease.tenantName}"></span>
            </p>
        </div>


        <p><strong>Program Type:</strong> <span th:text="${unit.programType}"></span></p>

        <p>
            <strong>Managed by Cornerstone:</strong>
            <span th:text="${unit.managedByCornerstone} ? 'Yes' : 'No'"></span>
        </p>

        <hr/>

        <h5>Unit Characteristics</h5>

        <p>
            <strong>Bedrooms:</strong>
            <span th:text="${unit.bedrooms} ?: 'Not specified'"></span>
        </p>

        <p>
            <strong>Bathrooms:</strong>
            <span th:text="${unit.bathrooms} ?: 'Not specified'"></span>
        </p>

        <p>
            <strong>Floors:</strong>
            <span th:text="${unit.floors} ?: 'Not specified'"></span>
        </p>

        <p>
            <strong>Basement:</strong>
            <span th:text="${unit.hasBasement} ? 'Yes' : 'No'"></span>
        </p>

        <hr/>

        <h5>Notes</h5>
        <p th:text="${unit.notes} ?: 'No notes available.'"></p>

        <div class="mt-4">
            <a th:href="@{/units/edit/{id}(id=${unit.id})}" class="btn btn-primary">
                Edit Unit
            </a>

            <a th:href="@{/units}" class="btn btn-secondary ms-2">
                Back to Units
            </a>
        </div>

    </div>
</div>

</body>
</html>
