<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Delete Unit</title>
    <link rel="icon" type="image/png" th:href="@{/images/Cornestone-small.png}">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- PAGE CONTENT -->
<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <h1 class="text-danger">Delete Unit</h1>
            <hr/>

            <div class="alert alert-warning">
                <h4>Are you sure you want to delete this unit?</h4>
                <p class="mb-0">This action cannot be undone.</p>
            </div>

            <div class="card shadow-sm p-4 mb-4" style="max-width: 500px;">
                <dl class="row mb-0">
                    <dt class="col-sm-4">ID:</dt>
                    <dd class="col-sm-8" th:text="${unit.id}"></dd>

                    <dt class="col-sm-4">Unit:</dt>
                    <dd class="col-sm-8" th:text="${unit.unitNumber}"></dd>

                    <dt class="col-sm-4">Address:</dt>
                    <dd class="col-sm-8" th:text="${unit.address}"></dd>
                </dl>
            </div>

            <form th:action="@{/units/delete/{id}(id=${unit.id})}" method="post">
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a th:href="@{/units}" class="btn btn-secondary ms-2">Cancel</a>
            </form>

        </div>
    </div>
</main>

<!-- SIDEBAR SCRIPT -->
<script th:src="@{/js/sidebar.js?v=1}"></script>

</body>
</html>
