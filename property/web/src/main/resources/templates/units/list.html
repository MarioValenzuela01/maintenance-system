<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Units List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .group-header {
            background-color: #f8f9fa;
            padding: 10px;
            margin-top: 20px;
            border-left: 5px solid #0d6efd;
            font-weight: bold;
        }
    </style>
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="text-primary">Unidades (Units)</h1>
    <a th:href="@{/units/create}" class="btn btn-success">+ Añadir Unidad</a>
</div>
<hr/>

<div th:if="${#lists.isEmpty(units)}" class="alert alert-info text-center">
    No hay unidades registradas.
</div>





    <div class="card shadow-sm p-4 mb-4">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Unit Number</th>
                <th>Address</th>
                <th>Status</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${units}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.unitNumber}"></td>
                <td th:text="${u.address}"></td>
                <td>
                    <span th:text="${u.status}"
                          class="badge"
                          th:classappend="${u.status == 'Occupied'} ? 'bg-danger' : 'bg-success'">
                    </span>
                </td>
                <td class="text-center">
                    <a th:href="@{/units/edit/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:href="@{/units/delete/{id}(id=${u.id})}" class="btn btn-sm btn-outline-danger ms-2">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

<div class="d-flex justify-content-center align-items-center mt-3">

    <a th:href="@{/units(page=${currentPage - 1})}"
       class="btn btn-outline-primary me-2"
       th:classappend="${currentPage == 0} ? ' disabled'">
        &lt;&lt;
    </a>

    <span>
        Page <span th:text="${currentPage + 1}"></span>
        of <span th:text="${totalPages}"></span>
    </span>

    <a th:href="@{/units(page=${currentPage + 1})}"
       class="btn btn-outline-primary ms-2"
       th:classappend="${currentPage + 1 >= totalPages} ? ' disabled'">
        &gt;&gt;
    </a>

</div>

<div class="mt-4 mb-5">
    <a th:href="@{/tenants}" class="btn btn-outline-primary">Tenants</a>
    <a th:href="@{/units}" class="btn btn-outline-info ms-2">Units</a>
    <a th:href="@{/}" class="btn btn-secondary ms-2">Home</a>
</div>

</body>
</html>
