<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Inspection</title>
    <link rel="icon" type="image/png" th:href="@{/images/Cornestone-small.png}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>
<body>

<div class="page-shell mt-4">

    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <div class="content-wrapper">

        <h1 class="text-primary">Edit Unit Inspection</h1>
        <hr>

        <form th:action="@{/unit-inspections/{id}/edit(id=${inspection.id})}"
              th:object="${inspection}"
              method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{id}">

            <div th:replace="~{unit-inspection/form :: inspectionForm}"></div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary" id="saveInspectionBtn">
                    Update Inspection
                </button>

                <a th:href="@{/unit-inspections/{id}(id=${inspection.id})}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

<script th:src="@{/js/loading.js?v=3}"></script>
<script th:src="@{/js/unit-inspection.js}"></script>
</body>
</html>
