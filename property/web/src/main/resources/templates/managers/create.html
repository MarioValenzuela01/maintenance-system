<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Manager</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- PAGE CONTENT -->
<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <h1 class="text-primary mb-4">Create Manager</h1>

            <div class="card shadow-sm p-4">
                <form th:action="@{/managers/create}" th:object="${manager}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Manager Name</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>

                    <button type="submit" class="btn btn-success">
                        Save
                    </button>

                    <a th:href="@{/managers}" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>
            </div>

        </div>
    </div>
</main>

<!-- SIDEBAR SCRIPT -->
<script th:src="@{/js/sidebar.js?v=1}"></script>

</body>
</html>
