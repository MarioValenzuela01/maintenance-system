<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Managers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="text-primary">Managers</h1>
    <a th:href="@{/managers/create}" class="btn btn-success">+ Create Manager</a>
</div>

<hr>

<div class="card shadow-sm p-4">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Units</th>
            <th class="text-center">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="m : ${managers}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.name}"></td>
            <td>
    <span th:if="${#lists.isEmpty(m.unitNumbers)}" class="text-muted">
        No units assigned
    </span>

                <span th:each="unitNumber, iterStat : ${m.unitNumbers}">
    <a th:href="@{/units/details/{id}(id=${m.unitIds[iterStat.index]})}"
       class="badge bg-primary me-1 text-decoration-none">
        <span th:text="${unitNumber}"></span>
    </a>
</span>
    </span>
            </td>
            <td class="text-center">
                <a th:href="@{/managers/{id}/assign-units(id=${m.id})}"
                   class="btn btn-sm btn-outline-primary">
                    Assign Units
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(managers)}">
            <td colspan="4" class="text-center text-muted">
                No managers registered.
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="mt-4">
    <a th:href="@{/}" class="btn btn-secondary">Home</a>
</div>

</body>
</html>
