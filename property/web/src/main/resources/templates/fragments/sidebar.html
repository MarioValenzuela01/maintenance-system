<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="sidebar" class="app-sidebar">

    <div class="sidebar-brand">
        <div class="brand-logo">
            <img th:src="@{/images/Cornestone-small.png}" alt="Cornerstone logo">
        </div>
        <div>
            <div class="brand-title">Cornerstone</div>
            <div class="brand-subtitle">Maintenance System</div>
        </div>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-section-title">Main</div>

        <a th:href="@{/}" class="sidebar-link">
            <span class="sidebar-icon">⌂</span>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/units}" class="sidebar-link">
            <span class="sidebar-icon">▦</span>
            <span>Units</span>
        </a>

        <a th:href="@{/units/map}" class="sidebar-link">
            <span class="sidebar-icon">⌖</span>
            <span>Map</span>
        </a>

        <a th:href="@{/tenants}" class="sidebar-link">
            <span class="sidebar-icon">👥</span>
            <span>Tenants</span>
        </a>

        <a th:href="@{/leases}" class="sidebar-link">
            <span class="sidebar-icon">▤</span>
            <span>Leases</span>
        </a>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-section-title">Operations</div>

        <a th:href="@{/unit-history}" class="sidebar-link">
            <span class="sidebar-icon">✦</span>
            <span>Maintenance History</span>
        </a>

        <a th:href="@{/managers}" class="sidebar-link">
            <span class="sidebar-icon">◉</span>
            <span>Managers</span>
        </a>

        <a th:href="@{/users}" class="sidebar-link"
           sec:authorize="hasRole('SUPER_ADMIN')">
            <span class="sidebar-icon">⚙</span>
            <span>Users</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="small text-muted">Signed in as</div>
            <div class="fw-bold" sec:authentication="name">User</div>
        </div>

        <form th:action="@{/logout}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                Logout
            </button>
        </form>
    </div>

</nav>

</body>
</html>
