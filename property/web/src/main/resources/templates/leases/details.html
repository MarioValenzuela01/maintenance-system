<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lease Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <div class="content-wrapper">

        <h1 class="text-primary">Lease Details</h1>
        <hr/>

        <div class="card shadow-sm p-4">

            <h4 class="text-primary mb-3">Lease Information</h4>

            <p><strong>Lease ID:</strong> <span th:text="${lease.id}"></span></p>
            <p><strong>Tenant:</strong> <span th:text="${lease.tenantName}"></span></p>
            <p><strong>Unit:</strong> <span th:text="${lease.unitNumber}"></span></p>
            <p><strong>Start Date:</strong> <span th:text="${lease.startDate}"></span></p>

            <p>
                <strong>End Date:</strong>
                <span th:if="${lease.endDate != null}" th:text="${lease.endDate}"></span>
                <span th:if="${lease.endDate == null}" class="text-success fw-bold">Current</span>
            </p>

            <p>
                <strong>Status:</strong>
                <span th:if="${lease.endDate == null}" class="badge bg-success">Active</span>
                <span th:if="${lease.endDate != null}" class="badge bg-secondary">Inactive</span>
            </p>

            <hr/>

            <h4 class="text-primary mb-3">Financial Information</h4>

            <p><strong>Rent Amount:</strong> $<span th:text="${lease.rentAmount}"></span></p>
            <p><strong>Subsidy:</strong> $<span th:text="${lease.subsidyAmount}"></span></p>
            <p><strong>Tenant Contribution:</strong> $<span th:text="${lease.tenantContribution}"></span></p>

            <div class="mt-3">
                <strong>Program Notes:</strong>
                <p class="border rounded p-3 bg-light"
                   th:text="${lease.programNotes != null ? lease.programNotes : 'No notes'}">
                </p>
            </div>

            <div class="mt-4">
                <a th:href="@{/leases/edit/{id}(id=${lease.id})}"
                   class="btn btn-warning"
                   th:if="${lease.endDate == null}">
                    Edit Lease
                </a>

                <a th:href="@{/leases}" class="btn btn-secondary ms-2">Back to Leases</a>
            </div>

        </div>

    </div>
</div>

</body>
</html>
