<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leases</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <div class="content-wrapper">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="text-primary">Leases Management</h1>
            <a th:href="@{/leases/create}" class="btn btn-success">+ New Lease</a>
        </div>

        <hr>

        <div class="card shadow-sm">
            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 text-center">

                    <thead class="table-dark">
                    <tr>
                        <th>Tenant</th>
                        <th>Unit</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="l : ${leases}">

                        <td th:text="${l.tenantName}"></td>
                        <td th:text="${l.unitNumber}"></td>
                        <td th:text="${l.startDate}"></td>

                        <td>
                            <span th:if="${l.endDate != null}" th:text="${l.endDate}"></span>
                            <span th:if="${l.endDate == null}" class="text-success fw-bold">Current</span>
                        </td>

                        <td>
                            <span th:if="${l.endDate == null}" class="badge bg-success">Active</span>
                            <span th:if="${l.endDate != null}" class="badge bg-secondary">History</span>
                        </td>

                        <td>
                            <a th:href="@{/leases/edit/{id}(id=${l.id})}"
                               class="btn btn-sm btn-outline-primary">Edit</a>

                            <form th:if="${l.endDate == null}"
                                  th:action="@{/leases/end/{id}(id=${l.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger">
                                    End
                                </button>
                            </form>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(leases)}">
                        <td colspan="6" class="text-muted">No leases</td>
                    </tr>

                    </tbody>

                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
