<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Leases</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <div class="content-wrapper">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="text-primary">Leases Management</h1>
            <a th:if="${!showHistory}"
               th:href="@{/leases(showHistory=true)}"
               class="btn btn-outline-secondary">
                View History
            </a>

            <a th:if="${showHistory}"
               th:href="@{/leases}"
               class="btn btn-outline-primary">
                View Active
            </a>
            <a th:href="@{/leases/create}" class="btn btn-success"
               sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')">
                + New Lease
            </a>
        </div>

        <hr>

        <div class="card shadow-sm">
            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 text-center">

                    <thead class="table-dark">
                    <tr>
                        <th>Tenant</th>
                        <th>Unit</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="lease : ${leases}"
                        th:data-url="@{/leases/details/{id}(id=${lease.id})}"
                        onclick="window.location=this.dataset.url"
                        style="cursor: pointer;">

                        <td th:text="${lease.tenantName}"></td>
<!--                        <td th:text="${lease.unitNumber}"></td>-->
                        <td th:text="${lease.unitDisplayLabel}"></td>
                        <td th:text="${lease.startDate}"></td>

                        <td>
                            <span th:if="${lease.endDate != null}" th:text="${lease.endDate}"></span>
                            <span th:if="${lease.endDate == null}" class="text-success fw-bold">Current</span>
                        </td>

                        <td>
                            <span th:if="${lease.endDate == null}" class="badge bg-success">Active</span>
                            <span th:if="${lease.endDate != null}" class="badge bg-secondary">History</span>
                        </td>

                        <td onclick="event.stopPropagation();">
                            <a th:href="@{/leases/edit/{id}(id=${lease.id})}"
                               class="btn btn-sm btn-outline-primary"
                               sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')">
                                Edit
                            </a>

                            <form th:if="${lease.endDate == null}"
                                  th:action="@{/leases/end/{id}(id=${lease.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')">
                                    End
                                </button>
                            </form>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(leases)}">
                        <td colspan="6" class="text-muted">No leases</td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </div>
</div>

</body>
</html>
