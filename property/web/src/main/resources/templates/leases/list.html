<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Leases</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- PAGE CONTENT -->
<main class="app-main">
    <div class="page-shell mt-4">
        <div class="content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h1 class="text-primary mb-0">Leases Management</h1>

                <div class="d-flex gap-2 flex-wrap">
                    <a th:if="${!showHistory}"
                       th:href="@{/leases(showHistory=true)}"
                       class="btn btn-outline-secondary">
                        View History
                    </a>

                    <a th:if="${showHistory}"
                       th:href="@{/leases}"
                       class="btn btn-outline-primary">
                        View Active
                    </a>

                    <a th:href="@{/leases/create}" class="btn btn-success"
                       sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')">
                        + New Lease
                    </a>
                </div>
            </div>

            <hr>

            <div class="card shadow-sm p-3">
                <div class="table-responsive">

                    <form th:action="@{/leases}"
                          method="get"
                          id="leaseSearchForm"
                          class="row g-2 mb-3">

                        <input type="hidden"
                               name="showHistory"
                               th:value="${showHistory}">

                        <div class="col-md-8">
                            <input type="text"
                                   id="leaseSearchInput"
                                   name="keyword"
                                   class="form-control"
                                   autocomplete="off"
                                   placeholder="Search tenant, unit, current, ended..."
                                   th:value="${keyword}">
                        </div>

                        <div class="col-md-4 d-flex gap-2">
                            <button class="btn btn-primary">
                                Search
                            </button>

                            <a th:href="@{/leases(showHistory=${showHistory})}"
                               class="btn btn-outline-secondary">
                                Clear
                            </a>
                        </div>

                    </form>

                    <table class="table table-hover align-middle mb-0 text-center">

                        <thead class="table-dark">
                        <tr>
                            <th>Tenant</th>
                            <th>Unit</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="lease : ${leases}"
                            th:data-url="@{/leases/details/{id}(id=${lease.id})}"
                            onclick="window.location=this.dataset.url"
                            style="cursor: pointer;">

                            <td th:text="${lease.tenantName}"></td>

                            <td th:text="${lease.unitDisplayLabel}"></td>

                            <td th:text="${lease.startDate}"></td>

                            <td>
                                <span th:if="${lease.endDate != null}"
                                      th:text="${lease.endDate}"></span>

                                <span th:if="${lease.endDate == null}"
                                      class="text-success fw-bold">
                                    Current
                                </span>
                            </td>

                            <td>
                                <span th:if="${lease.endDate == null}" class="badge bg-success">
                                    Active
                                </span>

                                <span th:if="${lease.endDate != null}" class="badge bg-secondary">
                                    History
                                </span>
                            </td>

                            <td onclick="event.stopPropagation();">
                                <a th:href="@{/leases/edit/{id}(id=${lease.id})}"
                                   class="btn btn-sm btn-outline-primary"
                                   sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')">
                                    Edit
                                </a>

                                <button th:if="${lease.endDate == null}"
                                        type="button"
                                        class="btn btn-sm btn-danger"
                                        sec:authorize="hasAnyRole('SUPER_ADMIN','ADMIN')"
                                        th:data-id="${lease.id}"
                                        onclick="openEndLeaseModal(this)">
                                    End
                                </button>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(leases)}">
                            <td colspan="6" class="text-muted py-4">
                                No leases
                            </td>
                        </tr>
                        </tbody>

                    </table>

                </div>
            </div>

        </div>
    </div>
</main>

<div class="modal fade"
     id="endLeaseModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <form id="endLeaseForm"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="modal-header">
                    <h5 class="modal-title">
                        End Lease
                    </h5>
                </div>

                <div class="modal-body">

                    <div class="form-check mb-2">

                        <input class="form-check-input"
                               type="radio"
                               checked
                               value="today"
                               name="mode"
                               onchange="toggleEndDate()">

                        <label>
                            Use today's date
                        </label>

                    </div>

                    <div class="form-check mb-3">

                        <input class="form-check-input"
                               type="radio"
                               value="custom"
                               name="mode"
                               onchange="toggleEndDate()">

                        <label>
                            Choose custom date
                        </label>

                    </div>

                    <input type="date"
                           id="customEndDate"
                           name="endDate"
                           class="form-control"
                           disabled>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-danger">
                        End Lease
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/lease-search.js?v=1}"></script>
<script th:src="@{/js/lease-end.js?v=1}"></script>

<!-- SIDEBAR SCRIPT -->
<script th:src="@{/js/sidebar.js?v=1}"></script>

</body>
</html>
