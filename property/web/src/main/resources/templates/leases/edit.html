<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Unit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="text-primary">Asignar Unidad a Arrendatario</h1>
<hr/>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm p-4">

            <div class="mb-3">
                <span class="badge"
                      th:classappend="${lease.endDate == null} ? 'bg-success' : 'bg-secondary'"
                      th:text="${lease.endDate == null} ? 'Active Lease' : 'Ended Lease'">
                </span>
            </div>

            <form th:action="@{/leases/edit/{id}(id=${lease.id})}" th:object="${lease}" method="post">
                <h4 class="text-primary mb-3">Lease Information</h4>

                <div class="mb-3">
                    <label class="form-label fw-bold">Tenant *</label>
                    <select th:field="*{tenantId}" class="form-select" required>
                        <option value="">-- Select Tenant --</option>
                        <option th:each="t : ${tenants}"
                                th:value="${t.id}"
                                th:text="${t.firstName + ' ' + t.lastName}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Unit *</label>
                    <select th:field="*{unitId}" class="form-select" required>
                        <option value="">-- Select Unit --</option>
                        <option th:each="u : ${units}"
                                th:value="${u.id}"
                                th:text="${u.unitNumber + ' - ' + u.address}">
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Start Date</label>
                    <input type="date"
                           th:name="startDate"
                           th:value="${lease.startDate}"
                           class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">End Date</label>
                    <div th:if="${lease.endDate == null}">
                        <span class="badge bg-success">Active Lease</span>
                    </div>

                    <div th:if="${lease.endDate != null}">
                        <input type="date"
                               th:name="endDate"
                               th:value="${lease.endDate}"
                               class="form-control">
                    </div>
                </div>



                <h4 class="text-primary mb-3">Household Information</h4>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Adults</label>
                        <input type="number" th:field="*{adultsCount}" class="form-control" min="0">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Children</label>
                        <input type="number" th:field="*{childrenCount}" class="form-control" min="0">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Seniors</label>
                        <input type="number" th:field="*{seniorsCount}" class="form-control" min="0">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Pets</label>
                        <input type="number" th:field="*{petsCount}" class="form-control" min="0">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Cars</label>
                        <input type="number" th:field="*{carsCount}" class="form-control" min="0">
                    </div>

                    <div class="col-md-4 mb-3 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" th:field="*{smokers}" class="form-check-input">
                            <label class="form-check-label fw-bold">Smokers</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Program Notes</label>
                    <textarea th:field="*{programNotes}" class="form-control" rows="3"></textarea>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                    <a th:href="@{/leases}" class="btn btn-secondary ms-2">Cancel</a>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
