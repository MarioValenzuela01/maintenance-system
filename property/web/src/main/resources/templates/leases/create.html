<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create Lease</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link th:href="@{/css/home.css?v=7}" rel="stylesheet"/>
</head>

<body>

<div class="page-shell mt-4">

    <!-- SIDEBAR -->
    <div class="sidebar-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <!-- CONTENT -->
    <div class="content-wrapper">

        <h1 class="text-primary">Assign Unit to Tenant</h1>
        <hr/>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">

                    <form th:action="@{/leases/create}" th:object="${lease}" method="post">

                        <h4 class="text-primary mb-3">Lease Information</h4>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tenant *</label>
                            <select th:field="*{tenantId}" class="form-select" required>
                                <option value="">-- Select Tenant --</option>
                                <option th:each="t : ${tenants}"
                                        th:value="${t.id}"
                                        th:text="${t.firstName + ' ' + t.lastName}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Unit *</label>
                            <select th:field="*{unitId}" class="form-select" required>
                                <option value="">-- Select Unit --</option>
                                <option th:each="u : ${units}"
                                        th:value="${u.id}"
                                        th:text="${u.unitNumber + ' - ' + u.address}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Start Date</label>
                            <input type="date" th:field="*{startDate}" class="form-control">
                            <small class="text-muted">
                                If left empty, the system will use today's date.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Program Notes</label>
                            <textarea th:field="*{programNotes}"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Optional notes about this lease or program"></textarea>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary px-4">Save Lease</button>
                            <a th:href="@{/leases}" class="btn btn-secondary ms-2">Cancel</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
