<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Unit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h1 class="text-primary">Asignar Unidad a Arrendatario</h1>
<hr/>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <form th:action="@{/leases/create}" th:object="${lease}" method="post">

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">Seleccionar Arrendatario *</label>
                    <select th:field="*{tenantId}" class="form-select" required>
                        <option value="">-- Selecciona una persona --</option>
                        <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.firstName + ' ' + t.lastName}"></option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label class="control-label fw-bold">Seleccionar Unidad *</label>
                    <select th:field="*{unitId}" class="form-select" required>
                        <option value="">-- Selecciona una unidad --</option>
                        <option th:each="u : ${units}" th:value="${u.id}" th:text="${u.unitNumber + ' - ' + u.address}"></option>
                    </select>
                </div>

                <div class="form-group mt-4">
                    <button type="submit" class="btn btn-primary px-4">Crear Contrato</button>
                    <a th:href="@{/leases}" class="btn btn-secondary ms-2">Cancelar</a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
